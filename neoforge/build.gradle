plugins {
    id 'java'
    id 'eclipse'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${rootProject.mod_name}-NeoForge-${minecraft_version}-${rootProject.mod_version}"
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url "https://cursemaven.com" }
}

dependencies {
    implementation project(":common")
    implementation "curse.maven:platform-997634:9318519"
    implementation "curse.maven:vanillabackport-417430:9318571"
    implementation "curse.maven:farmers-delight-398521:8765184"
    implementation "curse.maven:rustic-delight-1106612:8549320"
    implementation "curse.maven:create-328085:7963363"
}

TaskCollection.metaClass.excludingNeoTasks = { ->
    delegate.matching { !it.name.startsWith("neo") }
}

tasks.withType(JavaCompile).excludingNeoTasks().configureEach {
    source(project(":common").sourceSets.main.allSource)
}

tasks.withType(ProcessResources).excludingNeoTasks().configureEach {
    from project(":common").sourceSets.main.resources
    inputs.property "mod_version", rootProject.mod_version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": rootProject.mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

compileTestJava {
    enabled = false // Skip it because NeoForge keeps complaining about broken tests.
}