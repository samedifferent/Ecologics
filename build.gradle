plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'org.spongepowered.gradle.vanilla' version '0.3.2' apply false
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

allprojects {
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version)
        withSourcesJar()
        withJavadocJar()
    }
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    maven {
        name = 'Sponge'
		url = 'https://repo.spongepowered.org/repository/maven-public'
	}
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.parchmentmc.org/" }
	maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}

tasks.register('mergeJars', Jar) {
    group = 'build'
    description = 'Builds and merges Fabric and NeoForge JARs into a multi-loader JAR that runs on both loaders.'

    archiveBaseName = "${mod_name}-NeoFab-${minecraft_version}"
    destinationDirectory = layout.buildDirectory.dir("neofab")

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def fabricJar = project(':fabric').tasks.named('jar')
    def neoForgeJar = project(':neoforge').tasks.named('jar')
    dependsOn(fabricJar, neoForgeJar)

    from(neoForgeJar.map { zipTree(it.archiveFile) })
    from(fabricJar.map { zipTree(it.archiveFile) })

    doFirst {
        def neoJarFile = neoForgeJar.get().archiveFile.get().asFile
        if (neoJarFile.exists()) {
            java.util.jar.JarFile jar = new java.util.jar.JarFile(neoJarFile)
            def neoManifest = jar.manifest
            if (neoManifest != null) {
                neoManifest.mainAttributes.each { key, value ->
                    manifest.attributes((key.toString()): value.toString())
                }
            }
            jar.close()
        }
    }
}
